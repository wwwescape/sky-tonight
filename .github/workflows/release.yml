name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag matches manifest version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version custom_components/sky_tonight/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
